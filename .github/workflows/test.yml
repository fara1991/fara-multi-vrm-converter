name: Tests

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

# 同じブランチ/PRで複数回トリガーされた場合、古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unity EditMode Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # パッケージファイルを ci/Assets/ にコピーしてテストプロジェクトを構成
      - name: Setup test project
        run: |
          mkdir -p ci/Assets/Fara/FaraMultiVrmConverter
          rsync -av \
            --exclude='.git' \
            --exclude='ci' \
            --exclude='.github' \
            --exclude='.githooks' \
            --exclude='*.unitypackage' \
            . ci/Assets/Fara/FaraMultiVrmConverter/

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ci/Library
          key: unity-library-2022-3-${{ hashFiles('ci/Packages/manifest.json') }}
          restore-keys: |
            unity-library-2022-3-

      - name: Run EditMode Tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ci
          unityVersion: 2022.3.22f1
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
