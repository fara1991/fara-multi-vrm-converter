name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # タグ名 (例: v1.2.3) からバージョン番号を取得
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup export project
        run: |
          mkdir -p ci/Assets/Fara/FaraMultiVrmConverter
          rsync -av \
            --exclude='.git' \
            --exclude='ci' \
            --exclude='.github' \
            --exclude='.githooks' \
            --exclude='*.unitypackage' \
            . ci/Assets/Fara/FaraMultiVrmConverter/

      - name: Download VRChat packages
        run: |
          curl -sL "https://vrchat.github.io/packages/index.json" -o /tmp/vrc_official.json
          echo "JSON size: $(wc -c < /tmp/vrc_official.json) bytes"
          echo "Top-level keys:"
          jq 'keys' /tmp/vrc_official.json
          echo "Package keys (first 10):"
          jq '.packages | keys | .[0:10]' /tmp/vrc_official.json

          install_pkg() {
            local PKG="$1"
            local VER="$2"
            local URL
            URL=$(jq -r ".packages[\"$PKG\"].versions[\"$VER\"].url" /tmp/vrc_official.json)
            echo "Installing $PKG@$VER from $URL"
            curl -sL "$URL" -o "/tmp/${PKG}.zip"
            mkdir -p "/tmp/${PKG}-extract"
            unzip -q "/tmp/${PKG}.zip" -d "/tmp/${PKG}-extract"
            local PKG_DIR
            PKG_DIR=$(find "/tmp/${PKG}-extract" -name "package.json" -maxdepth 3 | head -1 | xargs dirname)
            mkdir -p "ci/Packages/$PKG"
            cp -r "$PKG_DIR/." "ci/Packages/$PKG/"
          }

          AVATARS_VER=$(jq -r '[.packages["com.vrchat.avatars"].versions | keys[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort | last' /tmp/vrc_official.json)
          echo "Latest stable com.vrchat.avatars: $AVATARS_VER"
          BASE_VER=$(jq -r ".packages[\"com.vrchat.avatars\"].versions[\"$AVATARS_VER\"].dependencies[\"com.vrchat.base\"] // \"$AVATARS_VER\"" /tmp/vrc_official.json)
          echo "com.vrchat.base version: $BASE_VER"
          install_pkg "com.vrchat.base" "$BASE_VER"
          install_pkg "com.vrchat.avatars" "$AVATARS_VER"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ci/Library
          key: unity-library-2022-3-${{ hashFiles('ci/Packages/manifest.json') }}
          restore-keys: |
            unity-library-2022-3-

      # PackageExporter.Export を呼び出して .unitypackage を生成
      - name: Export UnityPackage
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ci
          unityVersion: 2022.3.22f1
          targetPlatform: StandaloneWindows64
          buildMethod: Fara.FaraMultiVrmConverter.Editor.PackageExporter.Export
          customParameters: -output /github/workspace/FaraMultiVrmConverter-${{ steps.version.outputs.version }}.unitypackage
          allowDirtyBuild: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FaraMultiVrmConverter ${{ github.ref_name }}
          body: |
            ## インストール方法

            ### VCC (推奨)
            リポジトリに追加してインストールしてください。

            ### 手動インストール
            `FaraMultiVrmConverter-${{ steps.version.outputs.version }}.unitypackage` をダウンロードし、
            Unity プロジェクトにインポートしてください。
          files: |
            FaraMultiVrmConverter-${{ steps.version.outputs.version }}.unitypackage
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
